<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nishi 👻</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0A0A1A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Particle Background -->
  <canvas id="particles"></canvas>

  <!-- Auth Screen -->
  <div id="auth-screen" class="screen active">
    <div class="auth-container">
      <div class="logo-3d">
        <div class="logo-ring"></div>
        <div class="logo-ring ring-2"></div>
        <div class="logo-ring ring-3"></div>
        <div class="logo-ghost">👻</div>
      </div>
      <h1 class="app-title">Nishi</h1>
      <p class="app-subtitle">Where messages come alive</p>
      <div class="auth-form">
        <div class="input-3d">
          <input type="text" id="auth-name" placeholder="Your name" autocomplete="off">
          <div class="input-glow"></div>
        </div>
        <button onclick="login()" class="btn-3d btn-primary">
          <span>Get Started</span>
          <div class="btn-shine"></div>
        </button>
      </div>
    </div>
  </div>

  <!-- Home Screen -->
  <div id="home-screen" class="screen">
    <div class="home-header">
      <div class="logo-mini">👻</div>
      <h1 class="home-title">Nishi</h1>
      <div class="header-actions">
        <button onclick="showScreen('profile-screen')" class="icon-btn-3d">👤</button>
      </div>
    </div>
    <div id="users-list" class="users-grid"></div>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen" class="screen">
    <div class="chat-header-3d">
      <button onclick="showScreen('home-screen')" class="back-btn-3d">←</button>
      <div class="chat-user-3d" id="chat-user-info">
        <div class="avatar-3d" id="chat-avatar">👤</div>
        <div>
          <h2 id="chat-name">Chat</h2>
          <span id="chat-status" class="status-3d">online</span>
        </div>
      </div>
      <div class="chat-actions-3d">
        <button onclick="startCall('audio')" class="call-btn-3d audio">📞</button>
        <button onclick="startCall('video')" class="call-btn-3d video">📹</button>
      </div>
    </div>
    <div id="messages-container" class="messages-3d"></div>
    <div class="chat-input-3d">
      <div class="input-wrap-3d">
        <input type="text" id="message-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMessage()">
      </div>
      <button onclick="sendMessage()" class="send-btn-3d">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <!-- Profile Screen -->
  <div id="profile-screen" class="screen">
    <div class="profile-header-3d">
      <button onclick="showScreen('home-screen')" class="back-btn-3d">←</button>
      <h2>Profile</h2>
    </div>
    <div class="profile-content">
      <div class="profile-avatar-3d">
        <div class="avatar-large-3d" id="profile-avatar">👻</div>
      </div>
      <h2 id="profile-name" class="profile-name-3d"></h2>
      <button onclick="logout()" class="btn-3d btn-danger">
        <span>Logout</span>
        <div class="btn-shine"></div>
      </button>
    </div>
  </div>

  <!-- Call Screen -->
  <div id="call-screen" class="screen">
    <div class="call-container-3d">
      <div class="call-bg-animation"></div>
      <div class="call-status-3d">
        <span id="call-status-text">Calling...</span>
        <span id="call-timer">00:00</span>
      </div>
      <div class="call-avatar-3d" id="call-avatar-big">👤</div>
      <div class="call-name-3d" id="call-name-big">Unknown</div>
      <video id="remote-video" autoplay playsinline></video>
      <video id="local-video" autoplay playsinline muted></video>
      <div class="call-actions-3d">
        <button onclick="toggleMute()" id="mute-btn" class="call-action-3d">🎤</button>
        <button onclick="toggleVideo()" id="video-toggle-btn" class="call-action-3d">📷</button>
        <button onclick="endCall()" class="call-action-3d end">📞</button>
      </div>
    </div>
  </div>

  <!-- Incoming Call -->
  <div id="incoming-call" class="incoming-call-3d" style="display:none">
    <div class="incoming-content-3d">
      <div class="incoming-avatar-3d" id="incoming-avatar">👤</div>
      <div class="incoming-name-3d" id="incoming-name">Someone</div>
      <div class="incoming-type-3d" id="incoming-type">Audio Call</div>
      <div class="incoming-actions-3d">
        <button onclick="declineCall()" class="decline-btn-3d">❌</button>
        <button onclick="acceptCall()" class="accept-btn-3d">📞</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast-3d"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
